<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login SITTA-UT</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow-lg border-0 rounded-4 p-4" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4">Login to SITTA UT</h3>
        
        <form id="formulirlogin">
            <!-- Kolom Username -->
            <div class="mb-3">
                <label for="email" class="form-label">Username</label>
                <input type="email" class="form-control" id="email" placeholder="somone@ut.ac.id" required autocomplete="off">
            </div>
            
            <!-- Kolom Password -->
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Masukkan password Anda" required>
		<a href="#" id="forgetLink">Lupa Password?</a>
            </div>
            
            <!-- Login Button -->
            <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
            <!-- Label Belum Punya Akun -->
            <div class="text-center">
                <span class="text-muted">Belum Punya Akun? </span>
                <a href="#" class="text-decoration-none">Daftar sekarang</a>
            </div>
        </form>
    </div>
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
